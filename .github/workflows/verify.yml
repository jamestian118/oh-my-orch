name: verify
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: chmod scripts
        run: chmod +x ./scripts/* || true
      - name: setup
        run: ./scripts/setup
      - name: verify
        run: ./scripts/verify
